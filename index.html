<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Kahorng</title>

<link rel="icon" type="image/png" href="https://i.ibb.co/MyFQSJGQ/kahorng-icon-512-1.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kahorng">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1120">

<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#0a1120;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#fff;
}

.loader{
    text-align:center;
}

.spinner{
    width:42px;
    height:42px;
    margin:0 auto 16px;
    border:4px solid rgba(255,255,255,.2);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}
</style>

<script>
window.location.replace(
  "https://script.google.com/macros/s/AKfycbyPfh6QQkWy4RGyu_IMHuGlsUMnvLnitumSPBvBr--tydSoO0qRQ4Xy-dHPAO1MQSQd/exec"
);
</script>

</head>

<body>

</div>
