<!DOCTYPE html>

<head>

<title>Kahorng</title>

<meta name="theme-color" content="#0a1120">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#0a1120;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.spinner{
    width:42px;
    height:42px;
    border:4px solid rgba(255,255,255,.2);
    border-top-color:white;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}

p{
    margin-top:18px;
    text-align:center;
    opacity:.8;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div>
    <div class="spinner"></div>
    <p>Opening Kahorng...</p>
</div>

<script>
